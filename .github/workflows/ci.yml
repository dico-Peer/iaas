name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend && pip install ruff fastapi uvicorn

      - name: Lint backend (ruff)
        run: cd backend && ruff check app/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci 2>/dev/null || npm install

      - name: Lint frontend (ESLint)
        run: cd frontend && npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: cd backend && pip install mypy fastapi pydantic

      - name: Type-check backend (mypy)
        run: cd backend && mypy app/ || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: cd frontend && npm ci 2>/dev/null || npm install

      - name: Type-check frontend (tsc)
        run: cd frontend && npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: cd backend && pip install -r requirements.txt pytest pytest-asyncio

      - name: Run backend tests
        run: python -m pytest tests/ -v --ignore=tests/integration/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: cd frontend && npm ci 2>/dev/null || npm install

      - name: Run frontend tests
        run: cd frontend && npm run test || true
